# Fast end-to-end check: small window, few regions, tiny grid (~1 minute).
name: smoke
description: End-to-end smoke test of the whole pipeline.
seed: 1
n_regions: 4
results_root: /home/sux002/work/cis_heritability/results

data:
  geno_prefix: /expanse/lustre/projects/ddp412/sux002/cis_heritability_data/1000G.EUR.
  chromosomes: [21, 22]
  window_bp: 50000
  min_snps: 50
  max_snps: 3000

region:
